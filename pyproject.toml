[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ada-jarvis"
version = "0.1.0"
description = "ADA: a local-first personal operating agent for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Samad"}]
dependencies = [
  "apscheduler>=3.10,<4",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
  "google-api-python-client>=2.140",
  "google-auth>=2.34",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "twilio>=9.2",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0", "sounddevice>=0.5", "scipy>=1.14"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
ada = "ada.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ada"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
